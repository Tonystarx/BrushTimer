<title>Brush Timer</title>
<style>
  :root {
    --bg: #000;
    --text: #e9eef7;
    --muted: #8a9bbd;
    --accent: #5b84d6;
    --accent-hi: #7fa6ff;
    --tooth: #ffffff;
    --tooth-edge: #b4c6e8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    -webkit-user-select: none; user-select: none;
    touch-action: manipulation;
    overscroll-behavior: none;
  }
  .app {
    height: 100vh; height: 100dvh;
    display: flex; flex-direction: column; align-items: center;
    padding: calc(env(safe-area-inset-top) + 12px) 20px calc(env(safe-area-inset-bottom) + 16px);
    gap: 10px;
  }
  header { text-align: center; width: 100%; max-width: 480px; }
  .clocks { display: flex; justify-content: center; align-items: stretch; gap: 22px; }
  .clock { display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
  .clock-label { font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .time {
    font-size: clamp(56px, 17vw, 92px);
    font-weight: 250;
    letter-spacing: -1px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .section-time {
    font-size: clamp(40px, 12vw, 64px);
    font-weight: 300;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    color: var(--accent-hi);
    min-width: 2ch; text-align: center;
    padding-bottom: 3px;
  }
  .divider { width: 1px; align-self: stretch; background: #2a3348; margin: 18px 0 6px; }
  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
  .progress {
    display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px;
    width: 100%; max-width: 420px; margin: 12px auto 0;
  }
  .seg { height: 6px; border-radius: 3px; background: #1c2333; overflow: hidden; }
  .seg > i { display: block; height: 100%; width: 0%; background: var(--accent-hi); border-radius: 3px; }
  .seg.done > i { width: 100%; background: var(--accent); }

  .stage { flex: 1 1 auto; min-height: 0; width: 100%; max-width: 480px; display: flex; align-items: center; justify-content: center; }
  svg { width: 100%; height: 100%; display: block; }

  .tooth { fill: var(--tooth); stroke: var(--tooth-edge); stroke-width: 2.5; transition: fill .35s, stroke .35s, opacity .35s; }
  .quad.active .tooth { fill: var(--accent-hi); stroke: #dbe6ff; }
  .quad.done .tooth { opacity: .3; }
  .complete .tooth { fill: #fff; opacity: 1; }
  .side-label { fill: var(--accent); font-size: 34px; font-family: inherit; }

  .indicator { fill: none; stroke: var(--accent-hi); stroke-width: 9; stroke-linecap: round; opacity: 0; transition: opacity .3s; }
  .indicator.on { opacity: 1; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

  .controls { display: flex; gap: 12px; width: 100%; max-width: 420px; }
  button {
    font: inherit; font-size: 19px; font-weight: 600;
    min-height: 58px; border-radius: 16px; border: 0; cursor: pointer;
  }
  #start { flex: 2; background: var(--accent); color: #fff; }
  #start:disabled { background: #233150; color: #8a9bbd; }
  #reset { flex: 1; background: transparent; color: var(--text); border: 1.5px solid #3a4560; }
  button:active:not(:disabled) { transform: scale(.98); }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="clocks">
      <div class="clock">
        <div class="clock-label">Section</div>
        <div class="section-time" id="sectionTime">15</div>
      </div>
      <div class="divider"></div>
      <div class="clock">
        <div class="clock-label">Total</div>
        <div class="time" id="time">2:00</div>
      </div>
    </div>
    <div class="progress" id="progress"></div>
  </header>

  <div class="stage">
    <svg id="mouth" viewBox="0 0 600 880" aria-label="Teeth diagram" role="img">
      <defs>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="b"/>
          <feFlood flood-color="#8fb0ff" flood-opacity=".55"/>
          <feComposite in2="b" operator="in" result="g"/>
          <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <g id="indicators"></g>
      <g id="teeth" filter="url(#glow)"></g>
      <text class="side-label" x="38" y="452">L</text>
      <text class="side-label" x="540" y="452">R</text>
    </svg>
  </div>

  <div class="controls">
    <button id="start">Start</button>
    <button id="reset">Reset</button>
  </div>
</div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script>
(() => {
  "use strict";

  const TOTAL = 120;      // seconds
  const ZONE_LEN = 15;    // seconds per zone
  const ZONES = [         // mirror view: your left is on the screen's left
    { q: "UL", side: "outer", name: "Upper left" },
    { q: "UL", side: "inner", name: "Upper left" },
    { q: "UR", side: "outer", name: "Upper right" },
    { q: "UR", side: "inner", name: "Upper right" },
    { q: "LL", side: "outer", name: "Lower left" },
    { q: "LL", side: "inner", name: "Lower left" },
    { q: "LR", side: "outer", name: "Lower right" },
    { q: "LR", side: "inner", name: "Lower right" },
  ];

  // ---------- Teeth drawing ----------
  const NS = "http://www.w3.org/2000/svg";
  const CX = 300, A = 212, B = 340;
  const ARCH = { U: { cy: 395, dir: -1 }, L: { cy: 485, dir: 1 } };
  // Relative tooth widths from the midline back to the last molar
  const WIDTHS = { U: [54, 44, 46, 42, 42, 60, 62, 58], L: [36, 38, 46, 44, 46, 62, 60, 58] };
  const QUADS = { UL: ["U", -1], UR: ["U", 1], LL: ["L", -1], LR: ["L", 1] };
  const OFFSET = 48; // distance of outer/inner indicator from the arch line

  function arcSamples(arch, xSign, a, b, n = 400) {
    const { cy, dir } = ARCH[arch];
    const pts = [];
    let s = 0, prev = null;
    for (let i = 0; i <= n; i++) {
      const t = (Math.PI / 2) * (i / n);        // 0 at midline, pi/2 at the back
      const x = CX + xSign * a * Math.sin(t);
      const y = cy + dir * b * Math.cos(t);
      if (prev) s += Math.hypot(x - prev.x, y - prev.y);
      prev = { x, y, s };
      pts.push(prev);
    }
    return pts;
  }

  function pointAt(pts, s) {
    let lo = 0, hi = pts.length - 1;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; (pts[m].s < s ? lo = m : hi = m); }
    const p = pts[lo], q = pts[hi], f = (s - p.s) / ((q.s - p.s) || 1);
    return { x: p.x + (q.x - p.x) * f, y: p.y + (q.y - p.y) * f };
  }

  const teethG = document.getElementById("teeth");
  const indG = document.getElementById("indicators");
  const quadEls = {}, indEls = {};

  for (const [qid, [arch, xSign]] of Object.entries(QUADS)) {
    const pts = arcSamples(arch, xSign, A, B);
    const L = pts[pts.length - 1].s;
    const w = WIDTHS[arch];
    const scale = L / w.reduce((x, y) => x + y, 0);
    const g = document.createElementNS(NS, "g");
    g.setAttribute("class", "quad");
    const circles = [];
    let acc = 0;
    w.forEach(d => {
      const p = pointAt(pts, (acc + d / 2) * scale);
      acc += d;
      circles.push({ ...p, r: (d * scale / 2) * 1.07 });
    });
    // draw back molars first so front teeth overlap them
    circles.reverse().forEach(c => {
      const el = document.createElementNS(NS, "circle");
      el.setAttribute("cx", c.x.toFixed(1));
      el.setAttribute("cy", c.y.toFixed(1));
      el.setAttribute("r", c.r.toFixed(1));
      el.setAttribute("class", "tooth");
      g.appendChild(el);
    });
    teethG.appendChild(g);
    quadEls[qid] = g;

    for (const side of ["outer", "inner"]) {
      const off = side === "outer" ? OFFSET : -OFFSET;
      const ip = arcSamples(arch, xSign, A + off, B + off, 60);
      const path = document.createElementNS(NS, "path");
      path.setAttribute("d", ip.map((p, i) => (i ? "L" : "M") + p.x.toFixed(1) + " " + p.y.toFixed(1)).join(" "));
      path.setAttribute("class", "indicator");
      indG.appendChild(path);
      indEls[qid + side] = path;
    }
  }

  // ---------- Progress bar ----------
  const progress = document.getElementById("progress");
  const segs = ZONES.map(() => {
    const s = document.createElement("div");
    s.className = "seg";
    s.appendChild(document.createElement("i"));
    progress.appendChild(s);
    return s;
  });

  // ---------- Audio ----------
  let ctx = null, session = null;

  function ensureAudio() {
    // Ask Safari to treat this as media playback so it is not muted by the silent switch
    try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return Promise.resolve();
      ctx = new AC();
    }
    // Play one silent sample inside the tap to unlock audio on iOS
    const buf = ctx.createBuffer(1, 1, 22050);
    const src = ctx.createBufferSource();
    src.buffer = buf; src.connect(ctx.destination); src.start(0);
    return ctx.state === "running" ? Promise.resolve() : ctx.resume();
  }

  function bell(dest, t, freq, dur, vol) {
    const partials = [[1, 1], [2, 0.32], [3, 0.12], [4.2, 0.06]];
    for (const [ratio, amp] of partials) {
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      const d = dur / (1 + (ratio - 1) * 0.6);
      osc.type = "sine";
      osc.frequency.setValueAtTime(freq * ratio, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(vol * amp, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      osc.connect(g); g.connect(dest);
      osc.start(t); osc.stop(t + d + 0.05);
    }
  }

  function scheduleChimes(t0) {
    session = ctx.createGain();
    session.gain.value = 0.55;
    session.connect(ctx.destination);
    bell(session, t0, 523.25, 2.0, 0.75);                      // start bell: lower, longer (C5)
    for (let i = 1; i < ZONES.length; i++) {
      bell(session, t0 + i * ZONE_LEN, 784, 1.6, 0.7);        // soft single bell (G5)
    }
    const tf = t0 + TOTAL;                                     // final: rising three-note bell
    bell(session, tf, 659.25, 1.4, 0.6);
    bell(session, tf + 0.28, 783.99, 1.4, 0.6);
    bell(session, tf + 0.56, 1046.5, 3.0, 0.75);
    bell(session, tf + 0.56, 523.25, 3.0, 0.3);
  }

  function cancelChimes() {
    if (!session) return;
    try { session.gain.cancelScheduledValues(ctx.currentTime); session.gain.setValueAtTime(0, ctx.currentTime); } catch (e) {}
    try { session.disconnect(); } catch (e) {}
    session = null;
  }

  // ---------- Screen wake lock ----------
  let wakeLock = null;
  async function lockScreen() {
    try { if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); } catch (e) { wakeLock = null; }
  }
  function unlockScreen() {
    if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
  }

  // ---------- Confetti ----------
  const canvas = document.getElementById("confetti");
  const cctx = canvas.getContext("2d");
  const COLORS = ["#7fa6ff", "#5b84d6", "#ffffff", "#ffd166", "#ef476f", "#06d6a0", "#b8c7ff"];
  let pieces = [], confettiRaf = 0, confettiLast = 0;

  function sizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(innerWidth * dpr);
    canvas.height = Math.round(innerHeight * dpr);
    cctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function launchConfetti() {
    stopConfetti();
    sizeCanvas();
    const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    const n = reduce ? 40 : 160;
    const W = innerWidth, H = innerHeight;
    for (let i = 0; i < n; i++) {
      pieces.push({
        x: Math.random() * W,
        y: -20 - Math.random() * H * 0.6,       // staggered so they rain in over ~2s
        w: 6 + Math.random() * 6,
        h: 9 + Math.random() * 8,
        vy: 170 + Math.random() * 160,          // px per second
        vx: -30 + Math.random() * 60,
        rot: Math.random() * Math.PI * 2,
        vr: -6 + Math.random() * 12,
        sway: Math.random() * Math.PI * 2,
        color: COLORS[(Math.random() * COLORS.length) | 0],
      });
    }
    confettiLast = performance.now();
    confettiRaf = requestAnimationFrame(drawConfetti);
  }

  function drawConfetti() {
    const now = performance.now();
    const dt = Math.min(0.05, (now - confettiLast) / 1000);
    confettiLast = now;
    const H = innerHeight;
    cctx.clearRect(0, 0, innerWidth, H);
    pieces = pieces.filter(p => p.y < H + 30);
    for (const p of pieces) {
      p.sway += dt * 3;
      p.x += (p.vx + Math.sin(p.sway) * 40) * dt;
      p.y += p.vy * dt;
      p.rot += p.vr * dt;
      cctx.save();
      cctx.translate(p.x, p.y);
      cctx.rotate(p.rot);
      cctx.scale(1, Math.cos(p.rot * 0.7));     // flutter
      cctx.fillStyle = p.color;
      cctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      cctx.restore();
    }
    if (pieces.length) confettiRaf = requestAnimationFrame(drawConfetti);
    else cctx.clearRect(0, 0, innerWidth, H);
  }

  function stopConfetti() {
    cancelAnimationFrame(confettiRaf);
    pieces = [];
    cctx.clearRect(0, 0, canvas.width, canvas.height);
  }

  // ---------- Timer state ----------
  const timeEl = document.getElementById("time");
  const sectionEl = document.getElementById("sectionTime");
  const startBtn = document.getElementById("start");
  const resetBtn = document.getElementById("reset");
  const mouth = document.getElementById("mouth");

  let running = false, startWall = 0, curZone = -1, raf = 0;

  function fmt(sec) {
    const s = Math.max(0, Math.ceil(sec));
    return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  }

  function clearVisuals() {
    Object.values(quadEls).forEach(g => g.classList.remove("active", "done"));
    Object.values(indEls).forEach(p => p.classList.remove("on"));
    segs.forEach(s => { s.classList.remove("done"); s.firstChild.style.width = ""; });
    mouth.classList.remove("complete");
  }

  function showZone(z) {
    const zone = ZONES[z];
    Object.values(indEls).forEach(p => p.classList.remove("on"));
    for (const [qid, g] of Object.entries(quadEls)) {
      const zonesForQuad = ZONES.map((x, i) => x.q === qid ? i : -1).filter(i => i >= 0);
      g.classList.toggle("active", qid === zone.q);
      g.classList.toggle("done", zonesForQuad.every(i => i < z));
    }
    indEls[zone.q + zone.side].classList.add("on");
    segs.forEach((s, i) => { s.classList.toggle("done", i < z); if (i !== z) s.firstChild.style.width = ""; });
  }

  function tick() {
    if (!running) return;
    const elapsed = (performance.now() - startWall) / 1000;
    if (elapsed >= TOTAL) { finish(); return; }
    timeEl.textContent = fmt(TOTAL - elapsed);
    const inZone = elapsed % ZONE_LEN;
    sectionEl.textContent = String(Math.max(1, Math.ceil(ZONE_LEN - inZone)));
    const z = Math.min(ZONES.length - 1, Math.floor(elapsed / ZONE_LEN));
    if (z !== curZone) { curZone = z; showZone(z); }
    segs[z].firstChild.style.width = ((inZone / ZONE_LEN) * 100).toFixed(1) + "%";
    raf = requestAnimationFrame(tick);
  }

  async function start() {
    if (running) return;
    startBtn.disabled = true;
    startBtn.textContent = "Brushing…";
    stopConfetti();
    const ready = ensureAudio();   // must be called inside the tap
    lockScreen();
    try { await ready; } catch (e) {}
    clearVisuals();
    running = true;
    curZone = -1;
    startWall = performance.now();
    if (ctx) scheduleChimes(ctx.currentTime + 0.05);
    tick();
  }

  function finish() {
    running = false;
    cancelAnimationFrame(raf);
    unlockScreen();
    // let the final chime ring out; drop the session afterwards
    const s = session; session = null;
    if (s) setTimeout(() => { try { s.disconnect(); } catch (e) {} }, 4000);
    timeEl.textContent = "0:00";
    sectionEl.textContent = "0";
    clearVisuals();
    segs.forEach(s => s.classList.add("done"));
    mouth.classList.add("complete");
    startBtn.disabled = false;
    startBtn.textContent = "Start again";
    launchConfetti();
  }

  function reset() {
    running = false;
    cancelAnimationFrame(raf);
    cancelChimes();
    unlockScreen();
    stopConfetti();
    curZone = -1;
    clearVisuals();
    timeEl.textContent = fmt(TOTAL);
    sectionEl.textContent = String(ZONE_LEN);
    startBtn.disabled = false;
    startBtn.textContent = "Start";
  }

  startBtn.addEventListener("click", start);
  resetBtn.addEventListener("click", reset);
  window.addEventListener("resize", () => { if (pieces.length) sizeCanvas(); });

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && running) {
      if (ctx && ctx.state !== "running") ctx.resume().catch(() => {});
      lockScreen();
      cancelAnimationFrame(raf);
      tick();
    }
  });
})();
</script>
</body>
</html>
